<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Athlete Stress Sim</title>
  <desc id="desc">Local-first training-load, fitness-fatigue and race-readiness platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101C2F"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="420" rx="28" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>
  <rect width="1600" height="420" rx="28" fill="url(#grid)"/>

  <rect x="88" y="78" width="92" height="92" rx="24" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <path d="M 106 128 H 126 L 138 98 L 152 150 L 164 116 H 178" fill="none" stroke="url(#pulse)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="212" y="135" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="1.4" fill="#F8FAFC">ATHLETE STRESS SIM</text>
  <text x="214" y="180" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#94A3B8">Training load · Fitness-fatigue · Race readiness</text>
  <line x1="214" y1="208" x2="760" y2="208" stroke="url(#pulse)" stroke-width="3" stroke-linecap="round"/>
  <text x="214" y="248" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.4" fill="#64748B">Local-first · Polar AccessLink → DuckDB → FastAPI + Dash</text>

  <rect x="1400" y="30" width="112" height="38" rx="19" fill="#0F172A" stroke="#1E293B"/>
  <text x="1456" y="55" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7DD3FC">v1.0.0</text>

  <rect x="960" y="86" width="552" height="248" rx="22" fill="#0F172A" stroke="#1E293B"/>
  <text x="992" y="122" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="1.2" fill="#64748B">FITNESS · FATIGUE · FRESHNESS</text>

  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <line x1="992" y1="150" x2="1480" y2="150"/>
    <line x1="992" y1="190" x2="1480" y2="190"/>
    <line x1="992" y1="230" x2="1480" y2="230"/>
    <line x1="992" y1="270" x2="1480" y2="270"/>
  </g>

  <path d="M 992 272 C 1060 236, 1110 252, 1160 216 S 1260 186, 1320 200 S 1420 184, 1480 196" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
  <path d="M 992 286 C 1060 268, 1110 296, 1160 276 S 1260 254, 1320 264 S 1420 250, 1480 258" fill="none" stroke="#F87171" stroke-width="4" stroke-linecap="round"/>
  <path d="M 992 304 C 1060 312, 1110 286, 1160 292 S 1260 238, 1320 246 S 1420 208, 1480 214" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round"/>

  <circle cx="1480" cy="196" r="6" fill="#60A5FA"/>
  <circle cx="1480" cy="258" r="6" fill="#F87171"/>
  <circle cx="1480" cy="214" r="6" fill="#34D399"/>

  <text x="88" y="356" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">A personal training-load and race-readiness platform built on real Polar telemetry.</text>
</svg>
