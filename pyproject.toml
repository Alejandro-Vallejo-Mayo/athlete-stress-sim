[project]
name = "athlete-stress-sim"
version = "1.0.0"
description = "Local-first training-load, fitness-fatigue and race-readiness platform for Polar telemetry"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Alejandro Vallejo Mayo" },
]
keywords = ["running", "fatigue", "trimp", "acwr", "banister", "polar"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "fitparse>=1.2",
    "duckdb>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "dash>=2.17",
    "dash-mantine-components>=1.0",
    "plotly>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx2>=2.13.1",
]

[project.scripts]
athlete-stress-sim = "athlete_stress_sim.backend.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athlete_stress_sim"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PL",  # pylint
]
ignore = [
    "PLR0913", # too many arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
files = ["src"]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = ["fitparse.*", "dash_mantine_components.*", "plotly.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:fitparse",
]

[tool.coverage.run]
source = ["src/athlete_stress_sim/core"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
